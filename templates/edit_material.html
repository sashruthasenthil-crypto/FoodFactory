{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-3">Edit Raw Material</h2>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Material Name</label>
            <input type="text" name="name"
                   class="form-control"
                   value="{{ material.name }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Category</label>
            <input type="text" name="category"
                   class="form-control"
                   value="{{ material.category or '' }}">
        </div>

        <div class="mb-3">
            <label class="form-label">Quantity</label>
            <input type="number" name="quantity"
                   class="form-control"
                   value="{{ material.quantity }}"
                   min="0" step="any" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Unit</label>
            <select name="unit" class="form-control" required>
                <option value="kg" {% if material.unit == 'kg' %}selected{% endif %}>Kilograms (kg)</option>
                <option value="g" {% if material.unit == 'g' %}selected{% endif %}>Grams (g)</option>
                <option value="litre" {% if material.unit == 'litre' %}selected{% endif %}>Litres</option>
                <option value="ml" {% if material.unit == 'ml' %}selected{% endif %}>Millilitres (ml)</option>
                <option value="pieces" {% if material.unit == 'pieces' %}selected{% endif %}>Pieces</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Minimum Stock</label>
            <input type="number" name="minimum_stock"
                   class="form-control"
                   value="{{ material.minimum_stock }}"
                   min="0" step="any" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Supplier</label>
            <select name="supplier_id" class="form-control">
                <option value="">Select Supplier</option>

                {% for supplier in suppliers %}
                <option value="{{ supplier.id }}"
                    {% if material.supplier_id == supplier.id %}selected{% endif %}>
                    {{ supplier.name }}
                </option>
                {% endfor %}

            </select>
        </div>

        <button type="submit" class="btn btn-success">
            Update Material
        </button>

        <a href="{{ url_for('materials') }}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
