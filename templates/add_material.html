{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-3">Add Raw Material</h2>

    <form method="POST">

        <div class="mb-3">
            <label class="form-label">Material Name</label>
            <input type="text" name="name" class="form-control" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Category</label>
            <input type="text" name="category"
                   class="form-control" placeholder="Example: Ingredients">
        </div>

        <div class="mb-3">
            <label class="form-label">Quantity</label>
            <input type="number" name="quantity"
                   class="form-control" min="0" step="any" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Unit</label>
            <select name="unit" class="form-control" required>
                <option value="">Select Unit</option>
                <option value="kg">Kilograms (kg)</option>
                <option value="g">Grams (g)</option>
                <option value="litre">Litres</option>
                <option value="ml">Millilitres (ml)</option>
                <option value="pieces">Pieces</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Minimum Stock</label>
            <input type="number" name="minimum_stock"
                   class="form-control" min="0" step="any" value="0" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Supplier</label>
            <select name="supplier_id" class="form-control">
                <option value="">Select Supplier</option>

                {% for supplier in suppliers %}
                <option value="{{ supplier.id }}">
                    {{ supplier.name }}
                </option>
                {% endfor %}

            </select>
        </div>

        <button type="submit" class="btn btn-success">
            Save Material
        </button>

        <a href="{{ url_for('materials') }}" class="btn btn-secondary">
            Cancel
        </a>

    </form>

</div>

{% endblock %}
